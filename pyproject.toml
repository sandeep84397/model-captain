[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-captain"
version = "0.3.0a1"
description = "Provider-neutral model evaluation and evidence-based usage guidance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ModelCaptain contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
model-captain = "model_guide.cli:main"

[project.urls]
Homepage = "https://github.com/sandeep84397/model-captain"
Issues = "https://github.com/sandeep84397/model-captain/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_guide = ["data/*.json"]
